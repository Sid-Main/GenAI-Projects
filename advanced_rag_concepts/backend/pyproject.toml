[project]
name = "rag-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Siddhant Udgirkar", email = "siddhantu@heaptrace.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.165.0",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2.1.9",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
rag-app = "rag_app:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.29.0",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]
